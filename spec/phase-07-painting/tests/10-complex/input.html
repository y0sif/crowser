<html>
<head>
  <style>
    body { color: black; font-size: 16px; }
    .container {
      width: 600px;
      margin: 20px;
      padding: 15px;
      border-width: 3px;
      border-color: #333333;
      background-color: #EEEEEE;
    }
    .title {
      height: 40px;
      background-color: blue;
      color: white;
      font-size: 24px;
      padding: 5px;
      margin: 0px 0px 10px 0px;
    }
    .card {
      width: 560px;
      height: 60px;
      background-color: white;
      border-width: 1px;
      border-color: gray;
      padding: 10px;
      margin: 5px 0px;
    }
    .highlight {
      background-color: yellow;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title"><p>Dashboard</p></div>
    <div class="card"><p>First item content</p></div>
    <div class="card highlight"><p>Second item highlighted</p></div>
    <div class="card"><p>Third item content</p></div>
  </div>
</body>
</html>
