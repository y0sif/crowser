<html>
<head>
  <style>
    body { color: #333333; font-size: 18px; }
    h1 { font-size: 32px; margin: 10px 0px; }
    .container { width: 600px; padding: 20px; background-color: #F0F0F0; }
    p { color: blue; }
    #main { border-width: 2px; border-color: gray; }
    .highlight { background-color: yellow; color: red; }
    span { font-size: 14px; }
  </style>
</head>
<body>
  <div class="container" id="main">
    <h1>Title</h1>
    <p>Normal paragraph</p>
    <p class="highlight">Highlighted <span>small text</span></p>
  </div>
</body>
</html>
