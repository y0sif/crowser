name: Phase / Content Request
description: Suggest a new phase, stretch goal, or content improvement
title: "[Request]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Request type
      options:
        - "New stretch phase"
        - "New test case for existing phase"
        - "Guide improvement"
        - "Hint improvement"
        - "New tooling feature"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this useful? What problem does it solve for learners?
    validations:
      required: true
